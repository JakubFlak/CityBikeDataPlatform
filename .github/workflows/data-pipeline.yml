name: Data Pipeline

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5.4.1
      - run: uv sync --locked
      - name: Restore latest successful pipeline state
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/restore_pipeline_state.py
      - name: Run one pipeline job
        env:
          BIKE_DATA_ENV: github-actions
          BIKE_DATA_LOG_LEVEL: INFO
        run: uv run python scripts/run_pipeline.py
      - name: Upload successful pipeline state
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pipeline-state
          path: data
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pipeline-failure-${{ github.run_id }}
          path: data
          if-no-files-found: warn
          retention-days: 14