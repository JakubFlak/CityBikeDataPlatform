name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5.4.1
      - run: uv sync --locked --dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .