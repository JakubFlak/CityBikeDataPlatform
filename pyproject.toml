[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "city-bike-data-platform"
version = "0.1.0"
description = "Local data platform for Wroclaw bike-sharing data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"pyarrow>=17.0",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
	"ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
